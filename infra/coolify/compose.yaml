services:
  landing:
    build:
      context: ../..
      dockerfile: infra/coolify/Dockerfile
    restart: unless-stopped
    read_only: true
    user: "101:101"
    mem_limit: 64m
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    ports:
      - "100.103.252.10:9059:8080"
    volumes:
      - /srv/luccasfr-site/shared:/srv/luccasfr-site/shared:ro
    labels:
      traefik.enable: "false"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
