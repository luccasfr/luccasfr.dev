worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;
    map "$status:$uri" $site_cache_control {
        default "no-cache";
        ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        server_name _;
        root /srv/luccasfr-site/current;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control $site_cache_control always;

        location = /health { return 200 'ok'; }
        location / { try_files $uri $uri/ =404; }
        location ^~ /assets/ {
            root /srv/luccasfr-site/shared;
            try_files $uri =404;
        }
        location ~ /\. { return 404; }
        location ~ \.map$ { return 404; }
    }
}
